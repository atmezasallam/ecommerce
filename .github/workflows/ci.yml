name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "mysql://USER:PASSWORD@localhost:3306/ecommerce"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dummy_clerk_publishable_key"
  CLERK_SECRET_KEY: "sk_test_dummy_clerk_secret_key"
  CLERK_WEBHOOK_SIGNING_SECRET: "whsec_dummy_clerk_webhook_signing_secret"
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
  NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: "/"
  NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: "/"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_dummy_stripe_publishable_key"
  STRIPE_SECRET_KEY: "sk_test_dummy_stripe_secret_key"
  STRIPE_WEBHOOK_SECRET: "whsec_dummy_stripe_webhook_secret"
  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "dummy_cloud_name"
  NEXT_PUBLIC_CLOUDINARY_PRESET_NAME: "dummy_preset_name"
  IPINFO_TOKEN: "dummy_ipinfo_token"
  ADMIN_EMAILS: "admin@example.com"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
